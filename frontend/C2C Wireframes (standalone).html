  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

der-right:1px solid #EFEAE0;background:#FBFAF7;padding:10px 6px;display:flex;flex-direction:column;gap:8px;align-items:center\">\n                <div style=\"width:18px;height:18px;border-radius:5px;background:#E0772E\"><\u002Fdiv>\n                <div style=\"width:18px;height:18px;border-radius:5px;background:#E2DDD3\"><\u002Fdiv>\n                <div style=\"width:18px;height:18px;border-radius:5px;background:#E2DDD3\"><\u002Fdiv>\n                <div style=\"width:18px;height:18px;border-radius:5px;background:#E2DDD3\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;padding:13px\"><div style=\"height:9px;width:55%;border-radius:5px;background:#E2DDD3;margin-bottom:9px\"><\u002Fdiv><div style=\"height:34px;border-radius:8px;background:#EFEAE0;margin-bottom:7px\"><\u002Fdiv><div style=\"height:34px;border-radius:8px;background:#EFEAE0\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:Caveat,cursive;font-weight:700;font-size:16px;color:#5E8A3E;margin-top:8px\">✔ top = brand/profile, rail = sections · best of both<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:22px;padding:14px 18px;border:1px dashed #C9B79E;border-radius:12px;background:#FBF6EE;font-family:Caveat,cursive;font-weight:700;font-size:18px;color:#A8744A\">My lean → <span style=\"color:#22323E\">Option C (Hybrid)<\u002Fspan> — you have 7+ areas, the rail keeps them all one tap away while the top bar holds identity &amp; profile. Collapses to a bottom tab bar on mobile.<\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ CALENDAR ============ -->\n    <section style=\"display:{{ dCal }}\">\n      <div style=\"margin-bottom:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:.14em;color:#A8896A;font-family:'Geist Mono',monospace\">EXPLORATION 03<\u002Fdiv>\n        <h2 style=\"margin:4px 0 6px;font-size:26px;font-weight:700\">Calendar — year filter, two views<\u002Fh2>\n        <p style=\"margin:0;max-width:720px;font-size:14.5px;line-height:1.55;color:#6E6A61\">One calendar, year toggle on top (your choice). <b>Try the filter<\u002Fb> — it actually re-filters both the grid and the agenda below. Dots: <span style=\"color:#2A6F97;font-weight:600\">● session<\u002Fspan> · <span style=\"color:#E0772E;font-weight:600\">● contest<\u002Fspan> · <span style=\"color:#7A4FB0;font-weight:600\">● hackathon<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- live year filter -->\n      <div style=\"display:flex;gap:8px;margin-bottom:18px;align-items:center;flex-wrap:wrap\">\n        <span style=\"font-size:12px;color:#9A9488;font-family:'Geist Mono',monospace\">YEAR:<\u002Fspan>\n        <sc-for list=\"{{ years }}\" as=\"y\" hint-placeholder-count=\"5\">\n          <button onclick=\"{{ y.onClick }}\" style=\"border:1px solid #D9D3C8;background:{{ y.bg }};color:{{ y.fg }};font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;padding:7px 16px;border-radius:9px;cursor:pointer\">{{ y.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start\">\n        <!-- A month grid -->\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:8px\"><div style=\"font-size:13px;font-weight:600\">OPTION A · Month grid<\u002Fdiv><div style=\"font-family:Caveat,cursive;font-weight:700;font-size:16px;color:#E0772E\">best for \"what's this month\"<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #D9D3C8;border-radius:14px;box-shadow:0 1px 0 #E7E2D8;padding:18px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px\"><div style=\"font-size:16px;font-weight:700;color:#22323E\">March 2026<\u002Fdiv><div style=\"display:flex;gap:6px\"><div style=\"width:26px;height:26px;border-radius:7px;border:1px solid #E4DFD5;display:flex;align-items:center;justify-content:center;color:#9A9488;font-size:13px\">‹<\u002Fdiv><div style=\"width:26px;height:26px;border-radius:7px;border:1px solid #E4DFD5;display:flex;align-items:center;justify-content:center;color:#9A9488;font-size:13px\">›<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px\">\n              <div style=\"text-align:center;font-size:10px;color:#A8A296;font-family:'Geist Mono',monospace\">S<\u002Fdiv><div style=\"text-align:center;font-size:10px;color:#A8A296;font-family:'Geist Mono',monospace\">M<\u002Fdiv><div style=\"text-align:center;font-size:10px;color:#A8A296;font-family:'Geist Mono',monospace\">T<\u002Fdiv><div style=\"text-align:center;font-size:10px;color:#A8A296;font-family:'Geist Mono',monospace\">W<\u002Fdiv><div style=\"text-align:center;font-size:10px;color:#A8A296;font-family:'Geist Mono',monospace\">T<\u002Fdiv><div style=\"text-align:center;font-size:10px;color:#A8A296;font-family:'Geist Mono',monospace\">F<\u002Fdiv><div style=\"text-align:center;font-size:10px;color:#A8A296;font-family:'Geist Mono',monospace\">S<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:5px\">\n              <sc-for list=\"{{ cells }}\" as=\"c\" hint-placeholder-count=\"35\">\n                <div style=\"aspect-ratio:1;border-radius:8px;border:1px solid #F0ECE3;padding:5px;display:flex;flex-direction:column;justify-content:space-between\">\n                  <div style=\"font-size:11px;color:{{ c.dim }};font-weight:500\">{{ c.day }}<\u002Fdiv>\n                  <div style=\"display:flex;gap:2px;flex-wrap:wrap\">\n                    <sc-for list=\"{{ c.evs }}\" as=\"e\" hint-placeholder-count=\"0\">\n                      <div style=\"width:6px;height:6px;border-radius:50%;background:{{ e.color }}\"><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- B agenda -->\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:8px\"><div style=\"font-size:13px;font-weight:600\">OPTION B · Agenda list<\u002Fdiv><div style=\"font-family:Caveat,cursive;font-weight:700;font-size:16px;color:#E0772E\">best for mobile / \"what's next\"<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #D9D3C8;border-radius:14px;box-shadow:0 1px 0 #E7E2D8;padding:8px\">\n            <sc-for list=\"{{ agenda }}\" as=\"a\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;gap:13px;align-items:center;padding:12px 12px;border-bottom:1px solid #F2EEE5\">\n                <div style=\"width:44px;height:44px;border-radius:10px;background:#F6F3ED;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0\"><div style=\"font-size:10px;color:#A8A296;font-family:'Geist Mono',monospace\">MAR<\u002Fdiv><div style=\"font-size:16px;font-weight:700;color:#22323E;line-height:1\">{{ a.day }}<\u002Fdiv><\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:13.5px;font-weight:600;color:#2B2A26\">{{ a.title }}<\u002Fdiv>\n                  <div style=\"display:flex;gap:8px;align-items:center;margin-top:3px\"><span style=\"display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#7A766C\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ a.color }};display:inline-block\"><\u002Fspan>{{ a.type }}<\u002Fspan><span style=\"font-size:11px;color:#A8A296\">·<\u002Fspan><span style=\"font-size:11px;color:#7A766C\">{{ a.yr }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;color:#A8896A;font-family:'Geist Mono',monospace\">RSVP<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ LEADERBOARD ============ -->\n    <section style=\"display:{{ dLead }}\">\n      <div style=\"margin-bottom:22px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:.14em;color:#A8896A;font-family:'Geist Mono',monospace\">EXPLORATION 04<\u002Fdiv>\n        <h2 style=\"margin:4px 0 6px;font-size:26px;font-weight:700\">Leaderboard — total points across contests<\u002Fh2>\n        <p style=\"margin:0;max-width:700px;font-size:14.5px;line-height:1.55;color:#6E6A61\">Aggregate of all HackerRank contests we run. Three takes on the same data: a clean ranked table, a podium-forward card view, and a compact list with a sticky \"your rank\".<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- A table -->\n      <div style=\"margin-bottom:30px\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:8px\"><div style=\"font-size:13px;font-weight:600\">OPTION A · Ranked table<\u002Fdiv><div style=\"font-family:Caveat,cursive;font-weight:700;font-size:16px;color:#E0772E\">dense, sortable, scales to 340 rows<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D9D3C8;border-radius:14px;box-shadow:0 1px 0 #E7E2D8;overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:56px 1fr 80px 110px 90px;gap:0;padding:11px 18px;background:#FBFAF7;border-bottom:1px solid #EFEAE0;font-size:11px;font-weight:600;letter-spacing:.06em;color:#9A9488;font-family:'Geist Mono',monospace\">\n            <div>RANK<\u002Fdiv><div>STUDENT<\u002Fdiv><div>YEAR<\u002Fdiv><div>SOLVED<\u002Fdiv><div style=\"text-align:right\">POINTS<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ leaders }}\" as=\"l\" hint-placeholder-count=\"7\">\n            <div style=\"display:grid;grid-template-columns:56px 1fr 80px 110px 90px;gap:0;padding:12px 18px;border-bottom:1px solid #F2EEE5;align-items:center\">\n              <div sty t-size:16px;font-weight:700;margin-bottom:4px\">Join the C2C core team<\u002Fdiv>\n            <div style=\"font-size:12px;color:#7A766C;margin-bottom:16px\">We recruit once a semester across 4 wings.<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:16px\">\n              <div style=\"flex:1;text-align:center\"><div style=\"width:26px;height:26px;border-radius:50%;background:#E0772E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin:0 auto 5px\">1<\u002Fdiv><div style=\"font-size:10px;color:#2B2A26;font-weight:600\">Apply<\u002Fdiv><\u002Fdiv>\n              <div style=\"height:2px;flex:1;background:#E4DFD5\"><\u002Fdiv>\n              <div style=\"flex:1;text-align:center\"><div style=\"width:26px;height:26px;border-radius:50%;background:#EDE8DE;color:#9A9488;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin:0 auto 5px\">2<\u002Fdiv><div style=\"font-size:10px;color:#9A9488\">Task<\u002Fdiv><\u002Fdiv>\n              <div style=\"height:2px;flex:1;background:#E4DFD5\"><\u002Fdiv>\n              <div style=\"flex:1;text-align:center\"><div style=\"width:26px;height:26px;border-radius:50%;background:#EDE8DE;color:#9A9488;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin:0 auto 5px\">3<\u002Fdiv><div style=\"font-size:10px;color:#9A9488\">Interview<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n              <div style=\"border:1px solid #E4DFD5;border-radius:9px;padding:10px;font-size:12px;font-weight:500\">🧠 Technical<\u002Fdiv>\n              <div style=\"border:1px solid #E4DFD5;border-radius:9px;padding:10px;font-size:12px;font-weight:500\">🎨 Design<\u002Fdiv>\n              <div style=\"border:1px solid #E4DFD5;border-radius:9px;padding:10px;font-size:12px;font-weight:500\">📣 Outreach<\u002Fdiv>\n              <div style=\"border:1px solid #E4DFD5;border-radius:9px;padding:10px;font-size:12px;font-weight:500\">🎬 Content<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:24px;padding:16px 20px;border:1px dashed #C9B79E;border-radius:12px;background:#FBF6EE;display:flex;gap:12px;align-items:center\">\n        <div style=\"font-size:22px\">🔒<\u002Fdiv>\n        <div style=\"font-family:Caveat,cursive;font-weight:700;font-size:18px;color:#A8744A;line-height:1.3\">Data privacy &amp; open-source are product-level promises — I'd surface them with a small \"Privacy-first · Open source on GitHub\" footer + an account page where students control what's public. Happy to wireframe those next.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- MORE -->\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:920}}\">\nclass Component extends DCLogic {\n  state = { tab: 'home', year: 'All' };\n\n  renderVals() {\n    const tab = this.state.tab;\n    const mk = (id, label) => ({ id, label, active: tab === id, onClick: () => this.setState({ tab: id }) });\n    const tabs = [ mk('home','Homepage'), mk('nav','Navigation'), mk('cal','Calendar'), mk('lead','Leaderboard'), mk('forum','Forum'), mk('more','More screens') ];\n    const disp = (id) => (tab === id ? 'block' : 'none');\n\n    const navItems = [\n      { label:'Home',        bg:'#FBEEE2', dot:'#E0772E' },\n      { label:'Calendar',    bg:'transparent', dot:'#D8D2C7' },\n      { label:'Contests',    bg:'transparent', dot:'#D8D2C7' },\n      { label:'Leaderboard', bg:'transparent', dot:'#D8D2C7' },\n      { label:'Forum',       bg:'transparent', dot:'#D8D2C7' },\n      { label:'Camps',       bg:'transparent', dot:'#D8D2C7' },\n    ];\n    const miniContests = [ {day:'07'}, {day:'15'}, {day:'24'} ];\n    const miniForum = [ {meta:'Senior story · 34 replies'}, {meta:'DSA doubt · 12 replies'}, {meta:'Internship · 21 replies'} ];\n\n    // ---- shared mock data used by later sections ----\n    const tc = (t) => t==='session' ? '#2A6F97' : t==='contest' ? '#E0772E' : '#7A4FB0';\n    const speakers = [\n      { name:'Speaker name', role:'SDE-2 · BigCo',     topic:'System design basics' },\n      { name:'Speaker name', role:'Founder · Startup',  topic:'Campus to founder' },\n      { name:'Speaker name', role:'Alum, 2021',         topic:'Cracking DSA rounds' },\n      { name:'Speaker name', role:'PM · ProductCo',     topic:'Breaking into PM' },\n    ];\n    const leaders = [\n      { rank:1, name:'Aarav S.', year:'3rd', pts:2480, solved:142 },\n      { rank:2, name:'Diya M.',  year:'2nd', pts:2310, solved:131 },\n      { rank:3, name:'Kabir R.', year:'4th', pts:2180, solved:128 },\n      { rank:4, name:'Isha P.',  year:'3rd', pts:1990, solved:120 },\n      { rank:5, name:'Veer K.',  year:'2nd', pts:1875, solved:111 },\n      { rank:6, name:'Sara T.',  year:'1st', pts:1640, solved:98 },\n      { rank:7, name:'Rohan D.', year:'4th', pts:1590, solved:95 },\n    ];\n    const tagStyle = { Placement:['#FBEEE2','#C2691F'], Internship:['#FBEEE2','#C2691F'], DSA:['#E7ECEE','#2A6F97'], Career:['#EAF2E2','#5E8A3E'], Web:['#EFE7F5','#7A4FB0'] };\n    const ts = (tag) => tagStyle[tag] || ['#EDE8DE','#7A766C'];\n    const threads = [\n      { kind:'story', tag:'Placement',  title:'How I converted my off-campus SDE offer', author:'Senior · 4th yr', votes:128, replies:34 },\n      { kind:'doubt', tag:'DSA',        title:'When to use memoization vs tabulation in DP?', author:'2nd yr', votes:23, replies:12 },\n      { kind:'story', tag:'Internship', title:'My summer at a fintech — what I wish I knew', author:'Senior · 3rd yr', votes:96, replies:21 },\n      { kind:'doubt', tag:'Career',     title:'CP vs dev for first year — where do I start?', author:'1st yr', votes:41, replies:18 },\n      { kind:'doubt', tag:'Web',        title:'React or plain JS for the upcoming hackathon?', author:'2nd yr', votes:17, replies:9 },\n    ].map(t => ({ ...t, tagBg: ts(t.tag)[0], tagFg: ts(t.tag)[1] }));\n    const stories = [\n      { title:'How I converted my off-campus SDE offer', author:'Senior · 4th yr', votes:128 },\n      { title:'My summer at a fintech — lessons learned', author:'Senior · 3rd yr', votes:96 },\n      { title:'Roadmap that got me into a product role', author:'Alum · 2024', votes:74 },\n    ];\n    const doubts = [\n      { title:'Memoization vs tabulation in DP — when?', author:'2nd yr', replies:12, solved:true },\n      { title:'CP vs dev for first year — where to start?', author:'1st yr', replies:18, solved:false },\n      { title:'How to prep for OA in 3 weeks?', author:'3rd yr', replies:7, solved:true },\n    ];\n    const categories = [\n      { name:'Placements & Offers', icon:'💼', bg:'#FBEEE2', count:84,  today:6 },\n      { name:'DSA & Problem Solving', icon:'🧩', bg:'#E7ECEE', count:212, today:14 },\n      { name:'Internships',          icon:'🌱', bg:'#EAF2E2', count:57,  today:3 },\n      { name:'Web / Dev',            icon:'🖥️', bg:'#EFE7F5', count:96,  today:8 },\n      { name:'Career & Life',        icon:'🧭', bg:'#F6F2EC', count:41,  today:2 },\n    ];\n\n    // ---- calendar ----\n    const yf = this.state.year;\n    const years = ['All','1st','2nd','3rd','4th'].map(y => ({\n      label:y, active:yf===y,\n      bg: yf===y ? '#E0772E' : '#FFFFFF',\n      fg: yf===y ? '#FFFFFF' : '#6E6A61',\n      onClick:()=>this.setState({year:y})\n    }));\n    const allEvents = [\n      {day:3,type:'session',year:'1st'},  {day:7,type:'contest',year:'2nd'},\n      {day:7,type:'session',year:'all'},  {day:12,type:'session',year:'3rd'},\n      {day:15,type:'contest',year:'all'}, {day:18,type:'hackathon',year:'all'},\n      {day:21,type:'session',year:'4th'}, {day:24,type:'contest',year:'1st'},\n      {day:28,type:'session',year:'2nd'},\n    ];\n    const show = (e) => yf==='All' || e.year==='all' || e.year===yf;\n    const offset = 2, days = 30, cells = [];\n    for (let i=0;i<35;i++){\n      const d = i-offset+1; const inMonth = d>=1 && d<=days;\n      const evs = inMonth ? allEvents.filter(e=>e.day===d && show(e)).map(e=>({color:tc(e.type)})) : [];\n      cells.push({ day: inMonth ? d : '', dim: inMonth ? '#2B2A26' : '#C8C2B7', evs });\n    }\n    const agenda = allEvents.filter(show).slice(0,6).map(e => ({\n      day:String(e.day), color:tc(e.type),\n      yr: e.year==='all' ? 'All years' : e.year+' year',\n      title: e.type==='session' ? 'Guest session' : e.type==='contest' ? 'HackerRank contest' : '48h Hackathon',\n      type: e.type.charAt(0).toUpperCase()+e.type.slice(1)\n    }));\n\n    return {\n      tabs,\n      dHome:disp('home'), dNav:disp('nav'), dCal:disp('cal'), dLead:disp('lead'), dForum:disp('forum'), dMore:disp('more'),\n      navItems, miniContests, miniForum,\n      speakers, leaders, top3: leaders.slice(0,3), rest: leaders.slice(3), threads,\n      stories, doubts, categories,\n      years, cells, agenda,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
